[package]
name = "leftovers"
version = "0.8.0"
edition = "2021"
rust-version = "1.89"  # rusqlite needs it
description = "Prints AI coding plan usage limits as JSON for the leftovers KDE widget"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
